<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>HeartCraft — Make someone's day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Quicksand:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --cream:#FFF7F4;
    --card:#FFFFFF;
    --rose:#E23F73;
    --rose-deep:#B92D58;
    --rose-pale:#FFD9E3;
    --blush:#FFE9EE;
    --plum:#3E2230;
    --plum-soft:#7A5C68;
    --gold:#D9A24B;
    --ring:rgba(226,63,115,0.18);
    --radius:22px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 10%, #FFE3EC 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, #FFE9D9 0%, transparent 40%),
      var(--cream);
    min-height:100vh;
    font-family:'Quicksand', sans-serif;
    color:var(--plum);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 16px 60px;
  }
  h1,h2,h3{font-family:'Fraunces', serif; margin:0;}
  .brand{
    display:flex; align-items:center; gap:10px; margin-bottom:28px;
  }
  .brand-mark{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(135deg,var(--rose),var(--rose-deep));
    display:flex;align-items:center;justify-content:center;
    color:white;font-size:17px;
  }
  .brand-name{font-family:'Fraunces',serif; font-size:20px; font-weight:600; letter-spacing:0.2px;}

  /* ---------- Phone shell ---------- */
  .phone{
    width:min(390px, 92vw);
    min-height:720px;
    background:linear-gradient(180deg,#fff,#FFF9F9);
    border-radius:38px;
    border:1px solid #F1D9DF;
    box-shadow:0 30px 60px -20px rgba(185,45,88,0.28), 0 2px 0 rgba(255,255,255,0.6) inset;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .phone::before{
    content:"";
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    width:110px; height:22px; background:#1c1116; border-radius:14px; z-index:5;
  }
  .phone-inner{
    flex:1; display:flex; flex-direction:column; padding:56px 22px 26px;
    position:relative; overflow:hidden;
  }
  .step-eyebrow{
    text-align:center; font-size:12px; color:var(--plum-soft); letter-spacing:0.4px; margin-bottom:6px;
  }
  .step-title{
    text-align:center; font-size:23px; font-weight:600; line-height:1.25; margin-bottom:4px;
  }
  .step-sub{
    text-align:center; font-size:13.5px; color:var(--plum-soft); margin-bottom:22px;
  }
  .back-btn{
    position:absolute; top:18px; left:18px; width:34px;height:34px;border-radius:50%;
    background:var(--blush); border:none; color:var(--rose-deep); font-size:16px;
    display:flex;align-items:center;justify-content:center; cursor:pointer; z-index:4;
  }
  .back-btn:hover{background:var(--rose-pale);}

  /* ---------- Option cards ---------- */
  .options{display:flex; flex-direction:column; gap:11px; overflow-y:auto; padding-bottom:8px; flex:1;}
  .opt{
    display:flex; align-items:center; gap:13px;
    background:#fff; border:1.5px solid #F1DCE2; border-radius:16px;
    padding:13px 16px; cursor:pointer; transition:all .15s ease; text-align:left;
    font-family:'Quicksand',sans-serif; font-size:15px; font-weight:600; color:var(--plum);
  }
  .opt .ico{
    width:30px;height:30px;border-radius:9px; background:var(--blush);
    display:flex;align-items:center;justify-content:center; font-size:16px; flex-shrink:0;
    overflow:hidden;
  }
  .icon-slot img{width:100%; height:100%; object-fit:cover; display:block;}
  .icon-slot.big{width:96px; height:96px; border-radius:20px; font-size:52px;}
  .icon-slot.xl{width:150px; height:150px; border-radius:24px; font-size:72px;}
  .icon-slot.round{border-radius:50%;}
  .icon-slot{
    display:flex; align-items:center; justify-content:center;
    background:var(--blush); flex-shrink:0;
  }
  .placeholder-note{font-size:9.5px; color:var(--plum-soft); opacity:0.7; margin-top:4px;}
  .opt:hover{border-color:var(--rose-pale); transform:translateY(-1px);}
  .opt.selected{border-color:var(--rose); background:linear-gradient(0deg,#FFF5F7,#FFF5F7); box-shadow:0 0 0 3px var(--ring);}

  /* ---------- Buttons ---------- */
  .primary-btn{
    margin-top:16px; width:100%; padding:15px; border:none; border-radius:16px;
    background:linear-gradient(135deg,var(--rose),var(--rose-deep)); color:white;
    font-family:'Quicksand',sans-serif; font-weight:700; font-size:15.5px; letter-spacing:0.2px;
    cursor:pointer; box-shadow:0 12px 22px -10px rgba(185,45,88,0.55);
    transition:transform .12s ease;
  }
  .primary-btn:hover{transform:translateY(-1px);}
  .primary-btn:disabled{opacity:0.45; cursor:not-allowed; transform:none;}
  .ghost-btn{
    margin-top:10px; width:100%; padding:13px; border-radius:16px;
    background:transparent; border:1.5px solid #F1DCE2; color:var(--plum-soft);
    font-family:'Quicksand',sans-serif; font-weight:600; font-size:14.5px; cursor:pointer;
  }
  .hint{text-align:center; font-size:12px; color:var(--plum-soft); margin-top:14px;}

  /* ---------- Inputs ---------- */
  .field-label{font-size:14px; font-weight:700; margin:14px 0 7px;}
  .field-label:first-child{margin-top:0;}
  input[type=text], textarea, select{
    width:100%; border:1.5px solid #F1DCE2; border-radius:14px; padding:12px 14px;
    font-family:'Quicksand',sans-serif; font-size:15px; color:var(--plum); background:#fff;
  }
  input[type=text]:focus, textarea:focus, select:focus{outline:none; border-color:var(--rose); box-shadow:0 0 0 3px var(--ring);}
  .date-row{display:flex; gap:10px;}
  .date-row select{flex:1;}
  textarea{font-family:'Caveat',cursive; font-size:19px; line-height:1.5; min-height:220px; resize:none;}
  .char-count{text-align:right; font-size:11px; color:var(--plum-soft); margin-top:4px;}

  .traits-count{
    position:absolute; top:56px; right:22px; font-size:11px; color:var(--plum-soft);
    background:var(--blush); padding:4px 9px; border-radius:20px; font-weight:700;
  }

  /* ---------- Progress ---------- */
  .progress-track{height:4px; background:#F3DEE4; border-radius:4px; margin-top:14px; overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg,var(--rose),var(--gold)); border-radius:4px; transition:width .35s ease;}

  /* ---------- Result / experience screens ---------- */
  .scene{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; position:relative; width:100%;
  }
  .scene-tag{position:absolute; top:0; right:0; font-size:11px; color:var(--plum-soft);}

  /* intro / QR */
  .heart-frame{
    width:210px; height:210px; position:relative; display:flex; align-items:center; justify-content:center;
    filter:drop-shadow(0 18px 26px rgba(185,45,88,0.35));
  }
  .heart-shape{
    position:absolute; inset:0; background:linear-gradient(160deg,#F0355F,#B01A42);
    clip-path: path('M105,190 C40,150 5,105 5,65 C5,30 32,5 62,5 C82,5 98,18 105,38 C112,18 128,5 148,5 C178,5 205,30 205,65 C205,105 170,150 105,190 Z');
  }
  .heart-shape svg{position:absolute; inset:0; width:100%; height:100%;}
  #qrcode{position:relative; z-index:2; padding:14px; background:transparent;}
  #qrcode img, #qrcode canvas{border-radius:6px; filter: drop-shadow(0 0 0 white);}
  .tap-label{margin-top:18px; font-size:13px; color:var(--plum-soft); font-weight:600;}
  .name-tag{font-family:'Fraunces',serif; font-size:15px; margin-bottom:10px; color:var(--plum-soft);}

  /* balloons */
  .balloon-field{width:100%; height:340px; position:relative;}
  .balloon{
    position:absolute; width:78px; height:96px; border-radius:50% 50% 50% 50% / 46% 46% 54% 54%;
    cursor:pointer; transition:transform .15s ease;
  }
  .balloon:hover{transform:scale(1.04);}
  .balloon::after{
    content:""; position:absolute; bottom:-26px; left:50%; width:2px; height:26px; background:#c9b8be; transform:translateX(-50%);
  }
  .balloon.pop{animation:popAnim .35s forwards;}
  @keyframes popAnim{ to{ transform:scale(1.5); opacity:0; } }
  .word-reveal{position:absolute; inset:0; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px; padding:20px;}
  .word-reveal span{font-family:'Fraunces',serif; font-style:italic; font-size:24px; color:var(--rose-deep); opacity:0; animation:wordIn .5s forwards;}
  @keyframes wordIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .balloon-caption{font-weight:700; color:var(--rose-deep); margin-bottom:16px; font-size:14px;}

  /* candle */
  .cake-wrap{display:flex; flex-direction:column; align-items:center;}
  .candle{position:relative; margin-bottom:6px;}
  .flame{
    width:14px; height:22px; background:radial-gradient(circle at 50% 70%, #FFE9A8, var(--gold) 60%, #E2762D 100%);
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%; margin:0 auto; transition:all .4s ease;
    box-shadow:0 0 18px 4px rgba(217,162,75,0.55);
  }
  .flame.out{opacity:0; transform:scale(0.2) translateY(6px);}
  .wick{width:3px; height:16px; background:#7A5C68; margin:0 auto;}
  .cake-emoji{font-size:64px; line-height:1;}
  .blow-btn{
    margin-top:22px; padding:12px 22px; border-radius:30px; border:1.5px solid var(--rose-pale);
    background:#fff; color:var(--rose-deep); font-weight:700; font-family:'Quicksand',sans-serif; cursor:pointer;
  }
  .blown-msg{font-family:'Fraunces',serif; font-style:italic; font-size:19px; margin-top:16px; color:var(--rose-deep);}

  /* envelope */
  .envelope{
    width:150px; height:100px; position:relative; cursor:pointer;
    background:linear-gradient(180deg,#fff,#FFF3F0); border:1.5px solid var(--rose-pale); border-radius:8px;
  }
  .envelope::before{
    content:""; position:absolute; top:0; left:0; width:0; height:0;
    border-left:75px solid transparent; border-right:75px solid transparent; border-top:52px solid #FFE3E9;
  }
  .envelope-heart{position:absolute; top:38px; left:50%; transform:translateX(-50%); font-size:18px; z-index:2;}
  .envelope .icon-slot{position:absolute; inset:0; width:100%; height:100%; background:transparent; border-radius:8px; font-size:20px;}
  .envelope .icon-slot img{object-fit:contain;}
  .letter-card{
    background:#fffdfb; border:1px solid #F1DCE2; border-radius:14px; padding:20px; text-align:left;
    width:100%; max-height:340px; overflow-y:auto; box-shadow:0 10px 26px -14px rgba(185,45,88,0.3);
  }
  .letter-card p{font-family:'Caveat',cursive; font-size:20px; line-height:1.55; margin:0 0 10px; color:var(--plum);}

  /* rose bouquet */
  .bouquet-wrap{position:relative; width:100%; height:340px; display:flex; align-items:center; justify-content:center;}
  .bouquet-emoji{font-size:96px; filter:drop-shadow(0 14px 18px rgba(185,45,88,0.3));}
  .bouquet-wrap .icon-slot{width:150px; height:150px; border-radius:0; background:transparent; filter:drop-shadow(0 14px 18px rgba(185,45,88,0.3));}
  .bouquet-wrap .icon-slot img{object-fit:contain;}
  .bubble{
    position:absolute; background:#fff; border:1px solid #F1DCE2; border-radius:14px; padding:7px 12px;
    font-size:12.5px; font-weight:700; color:var(--rose-deep); opacity:0; animation:bubbleIn .5s forwards; box-shadow:0 8px 16px -8px rgba(185,45,88,0.35);
  }
  @keyframes bubbleIn{from{opacity:0; transform:translateY(10px) scale(0.9);} to{opacity:1; transform:translateY(0) scale(1);}}

  /* final card */
  .final-illust{font-size:72px; margin-bottom:6px;}
  .final-title{font-family:'Fraunces',serif; font-style:italic; font-size:26px; margin-bottom:4px;}
  .final-sub{font-size:13.5px; color:var(--plum-soft); margin-bottom:18px;}
  .yn-row{display:flex; gap:10px; width:100%;}
  .yn-row button{flex:1; padding:12px; border-radius:14px; font-weight:700; font-family:'Quicksand',sans-serif; cursor:pointer;}
  .yn-yes{background:linear-gradient(135deg,var(--rose),var(--rose-deep)); border:none; color:#fff;}
  .yn-no{background:#fff; border:1.5px solid #F1DCE2; color:var(--plum-soft);}

  .sticker-card{background:#fff; border-radius:16px; padding:18px; box-shadow:0 14px 26px -14px rgba(185,45,88,0.3); width:100%;}
  .sticker-emoji{font-size:52px;}
  .sticker-sub{font-family:'Fraunces',serif; font-style:italic; font-size:15px; margin-top:8px; color:var(--plum-soft);}

  /* one last thing / gift */
  .gift-wrap{position:relative; display:inline-flex; cursor:pointer; margin-top:6px;}
  .gift-badge{
    position:absolute; top:-10px; right:-10px; background:var(--rose);
    color:#fff; font-size:12px; font-weight:700; width:22px; height:22px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(185,45,88,0.4);
    animation:badgePulse 1.4s infinite;
  }
  @keyframes badgePulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.12);} }
  .gift-wrap.opened .gift-badge{display:none;}
  .gift-wrap.opened{animation:giftShake 0.4s ease;}
  @keyframes giftShake{ 0%,100%{transform:rotate(0);} 25%{transform:rotate(-8deg);} 75%{transform:rotate(8deg);} }

  /* dots nav on generated experience */
  .dots{display:flex; gap:6px; justify-content:center; margin-top:16px;}
  .dot{width:6px;height:6px;border-radius:50%; background:#F1DCE2;}
  .dot.active{background:var(--rose);}
  .next-arrow{
    margin-top:18px; width:46px;height:46px;border-radius:50%; border:none;
    background:linear-gradient(135deg,var(--rose),var(--rose-deep)); color:#fff; font-size:18px; cursor:pointer;
    box-shadow:0 12px 22px -10px rgba(185,45,88,0.55);
  }

  .footer-note{margin-top:22px; font-size:12px; color:var(--plum-soft); text-align:center; max-width:340px;}
  .footer-note a{color:var(--rose-deep); font-weight:700; text-decoration:none;}

  .share-box{
    margin-top:14px; width:100%; display:flex; gap:8px; align-items:center;
    background:#FFF3F0; border:1px dashed var(--rose-pale); border-radius:14px; padding:10px 12px;
  }
  .share-box input{border:none; background:transparent; font-size:12px; flex:1; color:var(--plum-soft);}
  .copy-btn{border:none; background:var(--rose); color:#fff; font-size:11.5px; font-weight:700; padding:8px 12px; border-radius:10px; cursor:pointer; white-space:nowrap;}

  @media (max-width:420px){ .phone{min-height:680px;} }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }
</style>
</head>
<body>

  <div class="brand">
    <div class="brand-mark">♥</div>
    <div class="brand-name">HeartCraft</div>
  </div>

  <div class="phone" id="phone">
    <div class="phone-inner" id="phoneInner"></div>
  </div>

  <p class="footer-note">Build a small, gamified birthday page for someone you love — pick their traits, write a letter, and share the link.</p>

<script>window.__HC_PRESET = null;</script>
<script>
(function(){
  // ---------- IMAGE PLACEHOLDERS ----------
  // Drop your own files into an /images folder next to this page using these
  // exact names. Nothing breaks if a file is missing — it just falls back to
  // the emoji shown below until you add the real image.
  const IMG = {
    intro:        {src:'images/hero-craft.png',        emoji:'🎀'},
    heart:        {src:'images/heart-frame.png',        emoji:''},
    trait_sweet:  {src:'images/trait-sweet.png',        emoji:'♥'},
    trait_loyal:  {src:'images/trait-loyal.png',        emoji:'🐾'},
    trait_rock:   {src:'images/trait-rock.png',         emoji:'🪨'},
    trait_bestie: {src:'images/trait-bestie.png',       emoji:'⭐'},
    trait_there:  {src:'images/trait-there.png',        emoji:'🤍'},
    trait_kind:   {src:'images/trait-kind.png',         emoji:'☺️'},
    vibe_sweet_warm:  {src:'images/vibe-sweet-warm.png',  emoji:'🎀'},
    vibe_fun_playful: {src:'images/vibe-fun-playful.png', emoji:'😄'},
    vibe_deep_love:   {src:'images/vibe-deep-love.png',   emoji:'🔥'},
    cake_chocolate: {src:'images/cake-chocolate.png',  emoji:'🍫'},
    cake_princess:  {src:'images/cake-princess.png',   emoji:'🎂'},
    cake_galaxy:    {src:'images/cake-galaxy.png',     emoji:'🌌'},
    cake_strawberry:{src:'images/cake-strawberry.png', emoji:'🍓'},
    friend_bunny: {src:'images/friend-bunny.png', emoji:'🐰'},
    friend_kitty: {src:'images/friend-kitty.png', emoji:'🐱'},
    friend_teddy: {src:'images/friend-teddy.png', emoji:'🧸'},
    balloon1: {src:'images/balloon-1.png', emoji:'🎈'},
    balloon2: {src:'images/balloon-2.png', emoji:'🎈'},
    balloon3: {src:'images/balloon-3.png', emoji:'🎈'},
    balloon4: {src:'images/balloon-4.png', emoji:'🎈'},
    candle_cake: {src:'images/candle-cake.png', emoji:'🎂'},
    envelope:    {src:'images/envelope.png',    emoji:'✉️'},
    bouquet:     {src:'images/bouquet.png',     emoji:'💐'},
    final_couple:{src:'images/final-couple.png',emoji:'🐻🐼'},
    sticker:     {src:'images/sticker-gift.png',emoji:'🎁'},
    gift_box:    {src:'images/gift-box.png',    emoji:'🎁'},
  };

  // Renders an <img> that silently swaps to the emoji fallback if the file
  // isn't found — safe to call before you've added any images.
  function icon(key, cls){
    const item = IMG[key];
    if(!item) return '';
    const emojiAttr = item.emoji.replace(/"/g,'&quot;');
    return `<span class="icon-slot ${cls||''}" data-emoji="${emojiAttr}">`
         + `<img src="${item.src}" alt="" onerror="window.__hcFallback(this)"></span>`;
  }
  window.__hcFallback = function(img){
    const span = img.parentElement;
    if(!span) return;
    img.remove();
    span.style.background = 'transparent';
    span.textContent = span.dataset.emoji || '';
    span.style.fontSize = span.classList.contains('xl') ? '72px' : span.classList.contains('big') ? '52px' : '16px';
  };

  const TRAITS = [
    {id:'sweet', label:'Sweet', imgKey:'trait_sweet'},
    {id:'loyal', label:'Loyal', imgKey:'trait_loyal'},
    {id:'rock', label:'My rock', imgKey:'trait_rock'},
    {id:'bestie', label:'Bestie', imgKey:'trait_bestie'},
    {id:'there', label:'Always there', imgKey:'trait_there'},
    {id:'kind', label:'Kind heart', imgKey:'trait_kind'},
  ];
  const VIBES = [
    {id:'sweet_warm', label:'Sweet & Warm', imgKey:'vibe_sweet_warm'},
    {id:'fun_playful', label:'Fun & Playful', imgKey:'vibe_fun_playful'},
    {id:'deep_love', label:'Deep Love', imgKey:'vibe_deep_love'},
  ];
  const CAKES = [
    {id:'chocolate', label:'Chocolate Fantasy', imgKey:'cake_chocolate'},
    {id:'princess', label:'Princess Double Storey', imgKey:'cake_princess'},
    {id:'galaxy', label:'Galaxy Classic', imgKey:'cake_galaxy'},
    {id:'strawberry', label:'Strawberry Princess', imgKey:'cake_strawberry'},
  ];
  const FRIENDS = [
    {id:'bunny', label:'Bunny', imgKey:'friend_bunny'},
    {id:'kitty', label:'Kitty', imgKey:'friend_kitty'},
    {id:'teddy', label:'Teddy', imgKey:'friend_teddy'},
  ];
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  const state = {
    name:'', month:'May', day:1, traits:[], vibe:null, cake:null, friend:null, letter:'', from:''
  };

  function letterTemplate(){
    const traitWords = state.traits.map(id => TRAITS.find(t=>t.id===id).label).join(', ');
    const vibeLine = {
      sweet_warm: "You bring so much warmth and sweetness into my life. Every moment with you feels like home.",
      fun_playful: "Life is so much more fun with you around — thank you for every laugh and every silly moment.",
      deep_love: "My feelings for you run deeper than words can hold. I'm endlessly grateful for you."
    }[state.vibe] || "You bring so much warmth into my life.";
    return `Dear ${state.name || 'friend'},\n\nHappy Birthday to someone truly special! 🎂\n\nYou are ${traitWords || 'wonderful'}, and I'm so grateful to have you in my life.\n\n${vibeLine}`;
  }

  // ---------- STEP DEFINITIONS ----------
  const steps = ['intro','who','traits','vibe','cake','friend','letter','review'];
  let stepIndex = 0;

  const root = document.getElementById('phoneInner');

  function toggleTrait(id){
    const i = state.traits.indexOf(id);
    if(i>-1){ state.traits.splice(i,1); }
    else { if(state.traits.length>=3) return; state.traits.push(id); }
    render();
  }

  function goNext(){ stepIndex = Math.min(stepIndex+1, steps.length-1); render(); }
  function goBack(){ if(stepIndex===0) return; stepIndex--; render(); }

  function progressBar(pct){
    return `<div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>`;
  }

  function render(){
    const step = steps[stepIndex];
    let html = '';

    if(step !== 'intro'){
      html += `<button class="back-btn" onclick="__hc.back()">‹</button>`;
    }

    if(step === 'intro'){
      html = `
        <div class="scene">
          ${icon('intro','big')}
          <h2 class="final-title" style="margin-top:14px;">Craft a birthday page</h2>
          <p class="final-sub" style="max-width:260px;">Answer a few quick questions and we'll turn it into a little interactive gift you can share.</p>
          <button class="primary-btn" onclick="__hc.next()">Start crafting</button>
        </div>`;
    }

    else if(step === 'who'){
      html += `
        <div class="step-title">Whose birthday is it?</div>
        <div class="step-sub">Let's start with the basics</div>
        <div class="field-label">Name</div>
        <input type="text" id="nameInput" placeholder="e.g. Aiman" value="${state.name}">
        <div class="field-label">When is the special day?</div>
        <div class="date-row">
          <select id="monthSelect">${MONTHS.map(m=>`<option ${m===state.month?'selected':''}>${m}</option>`).join('')}</select>
          <select id="daySelect">${Array.from({length:31},(_,i)=>i+1).map(d=>`<option ${d===state.day?'selected':''}>${d}</option>`).join('')}</select>
        </div>
        <div class="field-label">Your name (from)</div>
        <input type="text" id="fromInput" placeholder="e.g. Masha" value="${state.from}">
        <button class="primary-btn" id="nextBtn">Next</button>
        ${progressBar(15)}
      `;
    }

    else if(step === 'traits'){
      html += `
        <div class="traits-count">${state.traits.length}/3</div>
        <div class="step-title">What describes your bond?</div>
        <div class="step-sub">Choose any 3</div>
        <div class="options">
          ${TRAITS.map(t=>`
            <button class="opt ${state.traits.includes(t.id)?'selected':''}" onclick="__hc.toggleTrait('${t.id}')">
              ${icon(t.imgKey,'ico')} ${t.label}
            </button>`).join('')}
        </div>
        <button class="primary-btn" id="nextBtn" ${state.traits.length!==3?'disabled':''}>Next</button>
        ${progressBar(32)}
      `;
    }

    else if(step === 'vibe'){
      html += `
        <div class="step-title">Pick the vibe ✨</div>
        <div class="step-sub">This shapes your letter's tone</div>
        <div class="options">
          ${VIBES.map(v=>`
            <button class="opt ${state.vibe===v.id?'selected':''}" onclick="__hc.setVibe('${v.id}')">
              ${icon(v.imgKey,'ico')} ${v.label}
            </button>`).join('')}
        </div>
        <button class="primary-btn" id="nextBtn" ${!state.vibe?'disabled':''}>Next</button>
        ${progressBar(48)}
      `;
    }

    else if(step === 'cake'){
      html += `
        <div class="step-title">Choose a cake 🎂</div>
        <div class="options">
          ${CAKES.map(c=>`
            <button class="opt ${state.cake===c.id?'selected':''}" onclick="__hc.setCake('${c.id}')">
              ${icon(c.imgKey,'ico')} ${c.label}
            </button>`).join('')}
        </div>
        <button class="primary-btn" id="nextBtn" ${!state.cake?'disabled':''}>Next</button>
        ${progressBar(64)}
      `;
    }

    else if(step === 'friend'){
      html += `
        <div class="step-title">Choose a little friend</div>
        <div class="options">
          ${FRIENDS.map(f=>`
            <button class="opt ${state.friend===f.id?'selected':''}" onclick="__hc.setFriend('${f.id}')">
              ${icon(f.imgKey,'ico')} ${f.label}
            </button>`).join('')}
        </div>
        <button class="primary-btn" id="nextBtn" ${!state.friend?'disabled':''}>Next</button>
        ${progressBar(80)}
      `;
    }

    else if(step === 'letter'){
      if(!state.letter) state.letter = letterTemplate();
      html += `
        <div class="step-title">Edit your letter 💌</div>
        <textarea id="letterInput" maxlength="800">${state.letter}</textarea>
        <div class="char-count" id="charCount">${state.letter.length}/800</div>
        <button class="primary-btn" id="nextBtn">Done</button>
        ${progressBar(92)}
      `;
    }

    else if(step === 'review'){
      const link = buildShareLink();
      html = `
        <div class="scene">
          <div class="name-tag">${state.from ? state.from + "'s Birthday!" : "Birthday Gift!"}</div>
          <div class="heart-frame">
            <div class="heart-shape"></div>
            <div id="qrcode"></div>
          </div>
          <div class="tap-label">Your page is ready ✨</div>

          <div class="share-box">
            <input type="text" readonly value="${link}" id="shareLink">
            <button class="copy-btn" onclick="__hc.copyLink()">Copy link</button>
          </div>
          <div class="placeholder-note" style="max-width:280px; margin-top:2px;">
            This link only opens for others once this site is hosted online (e.g. GitHub Pages). Testing locally? Use "Download page" below instead — it works with no hosting at all.
          </div>

          <button class="primary-btn" onclick="__hc.downloadPage()">⬇ Download page (.html)</button>
          <button class="ghost-btn" onclick="__hc.downloadQR()">⬇ Download QR code (.png)</button>
          <button class="ghost-btn" onclick="__hc.preview()">Preview experience</button>
          <button class="ghost-btn" onclick="__hc.restart()">Start over</button>
        </div>
      `;
    }

    root.innerHTML = html;
    wireStep(step);

    if(step === 'review'){
      const target = document.getElementById('qrcode');
      target.innerHTML = '';
      new QRCode(target, { text: buildShareLink(), width:130, height:130, colorDark:'#7a0c30', colorLight:'#ffffff', correctLevel: QRCode.CorrectLevel.M });
    }
  }

  function wireStep(step){
    const nextBtn = document.getElementById('nextBtn');
    if(step === 'who'){
      document.getElementById('nameInput').addEventListener('input', e=> state.name = e.target.value);
      document.getElementById('fromInput').addEventListener('input', e=> state.from = e.target.value);
      document.getElementById('monthSelect').addEventListener('change', e=> state.month = e.target.value);
      document.getElementById('daySelect').addEventListener('change', e=> state.day = parseInt(e.target.value));
      nextBtn.addEventListener('click', ()=>{
        const nameVal = document.getElementById('nameInput').value.trim();
        if(!nameVal) { document.getElementById('nameInput').style.borderColor = '#E23F73'; return; }
        state.name = nameVal;
        goNext();
      });
    }
    if((step==='traits'||step==='vibe'||step==='cake'||step==='friend') && nextBtn){
      nextBtn.addEventListener('click', goNext);
    }
    if(step === 'letter'){
      const ta = document.getElementById('letterInput');
      ta.addEventListener('input', e=>{
        state.letter = e.target.value;
        document.getElementById('charCount').textContent = `${e.target.value.length}/800`;
      });
      nextBtn.addEventListener('click', goNext);
    }
  }

  function buildShareLink(){
    const payload = {n:state.name, f:state.from, m:state.month, d:state.day, t:state.traits, v:state.vibe, c:state.cake, fr:state.friend, l:state.letter};
    const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
    const base = location.origin + location.pathname;
    return `${base}?g=${encoded}`;
  }

  // ---------- Experience (generated gift page) ----------
  const expSteps = ['open','final','balloons','candle','letter','bouquet','gift','sticker'];
  let expIndex = 0;

  function renderExperience(data){
    const step = expSteps[expIndex];
    let html = `<div class="scene">`;

    if(step === 'open'){
      html += `
          <div class="name-tag">${data.n}'s Birthday!</div>
          <div class="heart-frame">
            <div class="heart-shape"></div>
            <div id="qrcode2"></div>
          </div>
          <div class="tap-label" id="tapLabel" style="cursor:pointer;">Tap to open</div>
      `;
    }
    else if(step === 'balloons'){
      html += `
        <div class="balloon-caption">Pop all 4 balloons</div>
        <div class="balloon-field" id="balloonField">
          ${['#AEDFF7','#FFC4D6','#B7E4C7','#D6C3F2'].map((c,i)=>`
            <div class="balloon" data-i="${i}" style="left:${[15,58,15,58][i]}%; top:${[8,8,52,52][i]}%;" onclick="__hc.popBalloon(${i})">
              <span class="icon-slot round" style="width:100%;height:100%; background:radial-gradient(circle at 35% 30%, #fff8, ${c});" data-emoji="🎈">
                <img src="images/balloon-${i+1}.png" alt="" onerror="window.__hcFallback(this)">
              </span>
            </div>
          `).join('')}
          <div class="word-reveal" id="wordReveal" style="display:none;">
            ${['You','are','so','special'].map((w,i)=>`<span style="animation-delay:${i*0.18}s">${w}</span>`).join('')}
          </div>
        </div>
      `;
    }
    else if(step === 'candle'){
      html += `
        <div class="step-title" style="margin-bottom:22px;">Blow the candle</div>
        <div class="cake-wrap">
          <div class="candle"><div class="wick"></div><div class="flame" id="flame"></div></div>
          ${icon('candle_cake','xl')}
        </div>
        <button class="blow-btn" id="blowBtn">🎤 Blow into the mic</button>
        <div class="blown-msg" id="blownMsg" style="display:none;">Make a wish 🌙</div>
      `;
    }
    else if(step === 'letter'){
      html += `
        <div class="step-title" style="font-style:italic; margin-bottom:18px;">A Message From My Heart ♥</div>
        <div class="envelope" id="envelope">${icon('envelope','xl')}</div>
        <div class="tap-label">Tap the envelope</div>
        <div id="letterFull" style="display:none; width:100%;"></div>
      `;
    }
    else if(step === 'bouquet'){
      const msgs = ['Forever yours ♥','You make my world beautiful','You are my sunshine ☀️',
                    `Happy Birthday ${data.n} ♥`,"I'm lucky to have you",'My favorite person 💗'];
      const pos = [[6,10],[62,8],[4,58],[64,56],[0,32],[70,32]];
      html += `
        <div class="step-title" style="font-style:italic; margin-bottom:8px;">Your Rose Bouquet 🌹</div>
        <div class="bouquet-wrap">
          ${msgs.map((m,i)=>`<div class="bubble" style="left:${pos[i][0]}%; top:${pos[i][1]}%; animation-delay:${i*0.25+0.3}s;">${m}</div>`).join('')}
          ${icon('bouquet','xl')}
        </div>
      `;
    }
    else if(step === 'final'){
      html += `
        ${icon('final_couple','xl')}
        <div class="final-title" style="margin-top:10px;">Happy Birthday,<br>${data.n}</div>
        <div class="final-sub">Are you excited for what's next?</div>
        <div class="yn-row">
          <button class="yn-yes" onclick="__hc.expNext()">Yes</button>
          <button class="yn-no" onclick="__hc.expNext()">No</button>
        </div>
      `;
    }
    else if(step === 'gift'){
      html += `
        <div class="step-title" style="font-style:italic; margin-bottom:6px;">One Last Thing...</div>
        <div class="step-sub" style="margin-bottom:18px; font-style:italic;">Tap the gift</div>
        <div class="gift-wrap" id="giftWrap">
          <div class="gift-badge">2</div>
          ${icon('gift_box','big')}
        </div>
      `;
    }
    else if(step === 'sticker'){
      html += `
        <div class="sticker-card">
          <div style="display:flex; gap:10px; justify-content:center;">
            ${icon('friend_' + (data.fr||'bunny'), 'big')}
            ${icon('sticker','big')}
          </div>
          <div class="sticker-sub">Lots of love for you ♥<br>Once again, Happy Birthday ${data.n}!</div>
        </div>
        <button class="ghost-btn" onclick="__hc.restart()" style="margin-top:20px;">Craft your own</button>
      `;
    }

    html += `</div>`;
    if(step !== 'sticker'){
      html += `<div class="dots">${expSteps.map((s,i)=>`<div class="dot ${i===expIndex?'active':''}"></div>`).join('')}</div>`;
    }
    root.innerHTML = html;
    wireExperience(step, data);
  }

  function wireExperience(step, data){
    if(step === 'open'){
      const target = document.getElementById('qrcode2');
      new QRCode(target, { text: location.href, width:130, height:130, colorDark:'#7a0c30', colorLight:'#ffffff', correctLevel: QRCode.CorrectLevel.M });
      document.getElementById('tapLabel').addEventListener('click', ()=>{ expIndex++; renderExperience(data); });
    }
    if(step === 'candle'){
      document.getElementById('blowBtn').addEventListener('click', ()=>{
        document.getElementById('flame').classList.add('out');
        document.getElementById('blowBtn').style.display='none';
        document.getElementById('blownMsg').style.display='block';
        setTimeout(()=>{ expIndex++; renderExperience(data); }, 1400);
      });
    }
    if(step === 'letter'){
      document.getElementById('envelope').addEventListener('click', ()=>{
        document.getElementById('envelope').style.display='none';
        document.querySelector('.tap-label').style.display='none';
        const box = document.getElementById('letterFull');
        box.style.display='block';
        box.innerHTML = `<div class="letter-card"><p>${(data.l||'').replace(/\n/g,'</p><p>')}</p></div>
          <button class="next-arrow" onclick="__hc.expNext()">›</button>`;
      });
    }
    if(step === 'bouquet'){
      setTimeout(()=>{
        root.querySelector('.scene').insertAdjacentHTML('beforeend','<button class="next-arrow" onclick="__hc.expNext()">›</button>');
      }, 1600);
    }
    if(step === 'gift'){
      document.getElementById('giftWrap').addEventListener('click', function(){
        this.classList.add('opened');
        setTimeout(()=>{ expIndex++; renderExperience(data); }, 450);
      });
    }
  }

  function popBalloon(i){
    const b = document.querySelector(`.balloon[data-i="${i}"]`);
    if(!b || b.classList.contains('pop')) return;
    b.classList.add('pop');
    setTimeout(()=> b.style.visibility='hidden', 350);
    const popped = document.querySelectorAll('.balloon.pop').length;
    if(popped === 4){
      setTimeout(()=>{
        document.getElementById('wordReveal').style.display='flex';
        setTimeout(()=>{ expIndex++; renderExperience(currentData); }, 1800);
      }, 400);
    }
  }

  let currentData = null;
  function startExperienceFromPayload(payload){
    currentData = payload;
    expIndex = 0;
    renderExperience(payload);
  }

  // ---------- public API ----------
  window.__hc = {
    next: goNext,
    back: goBack,
    toggleTrait,
    setVibe:(id)=>{ state.vibe = id; render(); },
    setCake:(id)=>{ state.cake = id; render(); },
    setFriend:(id)=>{ state.friend = id; render(); },
    preview:()=> startExperienceFromPayload({n:state.name, f:state.from, fr:state.friend, l:state.letter, c:state.cake}),
    expNext:()=>{ expIndex++; renderExperience(currentData); },
    popBalloon,
    copyLink:()=>{
      const el = document.getElementById('shareLink');
      el.select(); document.execCommand('copy');
      const btn = event.target; const old = btn.textContent;
      btn.textContent = 'Copied!'; setTimeout(()=> btn.textContent = old, 1200);
    },
    downloadQR:()=>{
      const holder = document.getElementById('qrcode');
      if(!holder) return;
      const canvas = holder.querySelector('canvas');
      const img = holder.querySelector('img');
      const dataUrl = canvas ? canvas.toDataURL('image/png') : (img ? img.src : null);
      if(!dataUrl){ alert('QR not ready yet — try again in a second.'); return; }
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = `${(state.name || 'birthday').replace(/\s+/g,'-').toLowerCase()}-qr.png`;
      document.body.appendChild(a); a.click(); a.remove();
    },
    downloadPage:()=>{
      const payload = {n:state.name, f:state.from, m:state.month, d:state.day, t:state.traits, v:state.vibe, c:state.cake, fr:state.friend, l:state.letter};
      let fullHtml = document.documentElement.outerHTML;
      fullHtml = fullHtml.replace(
        'window.__HC_PRESET = null;',
        `window.__HC_PRESET = ${JSON.stringify(payload)};`
      );
      fullHtml = '<!DOCTYPE html>\n' + fullHtml;
      const blob = new Blob([fullHtml], {type:'text/html'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${(state.name || 'birthday').replace(/\s+/g,'-').toLowerCase()}-birthday-page.html`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=> URL.revokeObjectURL(url), 4000);
    },
    restart:()=>{
      history.replaceState({}, '', location.pathname);
      state.name=''; state.from=''; state.traits=[]; state.vibe=null; state.cake=null; state.friend=null; state.letter='';
      stepIndex = 0; expIndex = 0; render();
    }
  };

  // ---------- boot ----------
  if(window.__HC_PRESET){
    startExperienceFromPayload(window.__HC_PRESET);
  } else {
    const params = new URLSearchParams(location.search);
    if(params.has('g')){
      try{
        const decoded = JSON.parse(decodeURIComponent(escape(atob(params.get('g')))));
        startExperienceFromPayload(decoded);
      }catch(e){ render(); }
    } else {
      render();
    }
  }
})();
</script>
</body>
</html>
